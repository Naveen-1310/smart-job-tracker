# ===================================================================
# Smart Job Application Tracker — Application Configuration
# Using Spring Boot JdbcTemplate + MySQL (NO Hibernate)
# ===================================================================

spring.application.name=smart-job-tracker
server.port=${PORT:8080}

# ===================================================================
# MYSQL DATABASE CONFIGURATION (Supports local & cloud deployment)
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/job_tracker_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:0000}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# SQL INITIALIZATION
# Spring Boot runs schema.sql automatically on startup
# ===================================================================
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.continue-on-error=true

# ===================================================================
# JWT
# ===================================================================
app.jwt.secret=${APP_JWT_SECRET:5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437}
app.jwt.expiration=86400000

# ===================================================================
# CORS (Supports local & cloud frontend domains)
# ===================================================================
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://*.vercel.app,https://*.onrender.com,https://*.netlify.app}

# ===================================================================
# LOGGING
# ===================================================================
logging.level.com.jobtracker=INFO
logging.level.org.springframework.security=WARN
