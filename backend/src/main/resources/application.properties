# ===================================================================
# Smart Job Application Tracker — Application Configuration
# Using H2 in-memory database for zero-config startup
# ===================================================================

spring.application.name=smart-job-tracker
server.port=8080

# ===================================================================
# H2 IN-MEMORY DATABASE (no MySQL needed — works out of the box)
# ===================================================================
spring.datasource.url=jdbc:h2:mem:jobtracker;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===================================================================
# JPA / HIBERNATE
# ===================================================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===================================================================
# JWT
# ===================================================================
app.jwt.secret=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
app.jwt.expiration=86400000

# ===================================================================
# CORS
# ===================================================================
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# ===================================================================
# LOGGING
# ===================================================================
logging.level.com.jobtracker=INFO
logging.level.org.springframework.security=WARN
