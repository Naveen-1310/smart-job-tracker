# ===================================================================
# Smart Job Application Tracker — Application Configuration
# Using Spring Boot JdbcTemplate + MySQL (NO Hibernate)
# ===================================================================

spring.application.name=smart-job-tracker
server.port=8080

# ===================================================================
# MYSQL DATABASE CONFIGURATION
# ===================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/job_tracker_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=0000
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# SQL INITIALIZATION
# Spring Boot runs schema.sql automatically on startup
# ===================================================================
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.continue-on-error=true

# ===================================================================
# JWT
# ===================================================================
app.jwt.secret=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
app.jwt.expiration=86400000

# ===================================================================
# CORS
# ===================================================================
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# ===================================================================
# LOGGING
# ===================================================================
logging.level.com.jobtracker=INFO
logging.level.org.springframework.security=WARN
